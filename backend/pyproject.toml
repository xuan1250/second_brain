[project]
name = "second-brain"
version = "0.1.0"
description = "Local-first Second Brain knowledge repository"
requires-python = ">=3.13,<3.14"
dependencies = [
    "docling>=2.14.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "qdrant-client[fastembed]>=1.12.0",
    "sentence-transformers>=3.1.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "flashrank>=0.2.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.30",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-deepseek>=0.1.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "rich>=13.8.0",
    "laya>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: requires real LLM API key, bge-m3 weights and a running Qdrant"]
addopts = "-m 'not live'"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

