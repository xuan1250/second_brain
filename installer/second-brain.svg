<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Second Brain — Variation A: Synapse Hemisphere</title>
  <defs>
    <linearGradient id="bg-a" x1="20" y1="16" x2="236" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#172042"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="rim-a" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left-grad-a" x1="56" y1="62" x2="122" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="right-grad-a" x1="134" y1="62" x2="202" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Squircle Tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg-a)" stroke="url(#rim-a)" stroke-width="5"/>
  <rect x="22" y="22" width="212" height="212" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="128" cy="126" r="94" fill="url(#glow-a)"/>

  <!-- Left Hemisphere: Organic Neural Cortex Lobe -->
  <path
    d="M 118 64
       C 90 60, 65 76, 62 102
       C 49 112, 47 139, 60 155
       C 59 179, 83 196, 114 192
       L 118 192"
    fill="#6366f1"
    fill-opacity="0.22"
    stroke="url(#left-grad-a)"
    stroke-width="11.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Sculpted gyri folds (clear brain silhouette without letter 'E' look) -->
  <path
    d="M 104 88 C 84 89, 76 104, 86 116"
    fill="none"
    stroke="#c7d2fe"
    stroke-width="8.5"
    stroke-linecap="round"
  />
  <path
    d="M 75 138 C 74 156, 89 167, 108 164"
    fill="none"
    stroke="#a5b4fc"
    stroke-width="8.5"
    stroke-linecap="round"
  />

  <!-- Right Hemisphere: Geometric PCB Knowledge Graph -->
  <path
    d="M 138 64
       L 168 64
       L 193 89
       L 193 112
       L 203 124
       L 203 146
       L 188 160
       L 188 178
       L 170 192
       L 138 192"
    fill="#38bdf8"
    fill-opacity="0.16"
    stroke="url(#right-grad-a)"
    stroke-width="11.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Internal Circuit Traces -->
  <path
    d="M 138 96 L 160 96 L 172 86"
    fill="none"
    stroke="#7dd3fc"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 138 128 L 180 128"
    fill="none"
    stroke="#38bdf8"
    stroke-width="8"
    stroke-linecap="round"
  />
  <path
    d="M 138 160 L 158 160 L 170 172"
    fill="none"
    stroke="#34d399"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Terminal Circuit Nodes -->
  <circle cx="174" cy="84" r="9.5" fill="#38bdf8" stroke="#0f172a" stroke-width="3"/>
  <circle cx="182" cy="128" r="9.5" fill="#e0f2fe" stroke="#0f172a" stroke-width="3"/>
  <circle cx="172" cy="174" r="9.5" fill="#10b981" stroke="#0f172a" stroke-width="3"/>

  <!-- Midline Synapse Spine & Bridge -->
  <line x1="128" y1="60" x2="128" y2="196" stroke="#64748b" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="112" y1="96" x2="144" y2="96" stroke="#a5b4fc" stroke-width="7.5" stroke-linecap="round"/>
  <line x1="110" y1="128" x2="146" y2="128" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  <line x1="112" y1="160" x2="144" y2="160" stroke="#34d399" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Central Corpus Callosum Core -->
  <circle cx="128" cy="128" r="14.5" fill="#f8fafc" stroke="#38bdf8" stroke-width="4.5"/>
  <circle cx="128" cy="128" r="5" fill="#0f172a"/>
</svg>
